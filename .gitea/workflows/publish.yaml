name: Publish
run-name: Publish
on:
  push:
    branches:
      - master

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Clone repo
        uses: actions/checkout@v6
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build
        run: bun run build
      - name: Lint TypeScript
        run: bun lint:tsc
      - name: Lint Biome
        run: bun lint:biome
      - name: Test
        run: bun test
      - name: "Publish effect-lens (Effect v4, tag: latest)"
        uses: JS-DevTools/npm-publish@v4
        with:
          package: packages/effect-lens
          tag: latest
          access: public
          token: ${{ secrets.NPM_TOKEN }}
          registry: https://registry.npmjs.org
      - name: Prepare effect-lens-legacy (publish as effect-lens)
        run: npm pkg set name=effect-lens --prefix packages/effect-lens-legacy
      - name: "Publish effect-lens (Effect v3, tag: legacy)"
        uses: JS-DevTools/npm-publish@v4
        with:
          package: packages/effect-lens-legacy
          tag: legacy
          access: public
          token: ${{ secrets.NPM_TOKEN }}
          registry: https://registry.npmjs.org
